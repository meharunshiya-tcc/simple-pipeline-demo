
name: CI Pipeline

# Trigger pipeline whenever code is pushed
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    # GitHub provides an Ubuntu machine
    runs-on: ubuntu-latest

    steps:

      # Step 1: Get repository source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Step 3: Run tests
      - name: Run Tests
        run: npm test

      # Step 4: Build application
      - name: Build Application
        run: npm run build